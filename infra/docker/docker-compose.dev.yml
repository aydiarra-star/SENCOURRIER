# ═══════════════════════════════════════════════════════════════════════════
# SENCOURRIER — Socle de développement local
#
# Démarre uniquement les services d'infrastructure afin que `npm run dev`
# tourne en natif (HMR rapide). La stack complète est dans docker-compose.yml.
#
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

name: sencourrier-dev

services:
  postgres:
    # L'image pgvector inclut l'extension vector, requise par le RAG.
    image: pgvector/pgvector:pg16
    container_name: sencourrier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sencourrier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sencourrier}
      POSTGRES_DB: ${POSTGRES_DB:-sencourrier}
      # Collation française via ICU : tri correct des accents sans dépendre
      # des locales système générées dans l'image.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=fr-FR --locale=C.UTF-8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sencourrier} -d ${POSTGRES_DB:-sencourrier}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7.4-alpine
    container_name: sencourrier-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: sencourrier-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: 'true'
      # Analyse française pour le stemming des requêtes éditoriales.
      ingest.geoip.downloader.enabled: 'false'
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  mailpit:
    # Capture les emails sortants en développement (aucun envoi réel).
    image: axllent/mailpit:v1.21
    container_name: sencourrier-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
